[package]
# Deployed-artifact identity (⟨PETE:#2⟩, gate-2 correction): the package is
# `quorum-dispatch` so `cargo install --git <repo> --locked quorum-dispatch`
# resolves; the BINARY stays `qd` (auto-discovered from src/bin/qd/). The
# internal LIB symbol stays `dispatch` (see [lib]) — the dispatch crate/subsystem
# is deliberately preserved (C3 ruling), so `dispatch::` call sites are untouched.
name = "quorum-dispatch"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "qd engine crate (Rust rewrite). A1: data layer + Mux trait."

# Lib name preserved as `dispatch` (NOT renamed with the package): the dispatch
# subsystem is preserved by the sb-purge composite; renaming the lib symbol would
# churn 74 internal `dispatch::` call sites into the preserved subsystem.
[lib]
name = "dispatch"

[dependencies]
serde = { version = "1", features = ["derive"] }
# JSON key order is part of the ls --json parity surface (TS JSON.stringify
# emits keys in object-literal insertion order; see render.rs) — real
# consumers: telemetry.rs, events.rs, render.rs, bin/qd/verbs/mark.rs. The
# `preserve_order` feature itself is NOT requested directly here (see
# [features] below): a normal dependency edge unifies serde_json's features
# across every crate sharing it in one build, so requesting it unconditionally
# here would silently flip serde_json::Map's iteration order for ANY OTHER
# crate that adds a normal path dependency on this one (found the hard way —
# frame's cloud-archive Atomic C added exactly such an edge and it broke
# frame's own pinned "JSON key order stable for scripting" conformance test).
# `json-insertion-order` defaults ON so `qd`'s own binaries are byte-for-byte
# unaffected; a consumer that must NOT inherit it opts out via
# `default-features = false`.
serde_json = { version = "1" }
# SigV4 request signing for `qd backup`'s S3 client (archive/sigv4.rs). Reuses
# sha2's own transitive deps (crypto-common/digest/generic-array) — the only
# new crate the archive feature adds (see archive/http.rs's module doc for why
# the S3 client itself is hand-rolled over std::net rather than reqwest).
hmac = "0.12"
sha2 = "0.10"
# TLS for the archive S3 client's https:// endpoints (Atomic D): synchronous
# rustls wrapped around the same TcpStream behind archive/http.rs's single
# request() seam — no tokio/hyper/reqwest surface (see http.rs's module doc).
# Both crates already resolve in the workspace lock (transitive via
# hyper-rustls/tokio-rustls), so this pins no new versions. webpki-roots
# (bundled Mozilla roots) keeps per-host self-builds free of system cert/
# OpenSSL dependencies; ring backend for the same portability reason.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
libc = "0.2"
# clap v4 BUILDER API (no derive) — A3 CLI surface. We map clap's parse errors to
# commander phrasing + exit 1 ourselves (try_parse), so `derive`/`error-context`
# auto-wiring is off; we keep `std` + `help`/`usage` for the help layout.
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
# qrmux: the embedded mux backend (C1 D2). The EmbeddedMux adapter consumes the
# M3 library client ops (qrmux::client::*_data + ensure_server_running) over the
# protocol-v2 daemon. The adapter bridges sync `Mux` → async client via a
# lazily-init current-thread tokio runtime + block_on, so we bring tokio + anyhow
# in alongside it.
qrmux = { path = "../qrmux" }
# The shared delivery-event VOCABULARY (vocab-extract): the `Payload` enum,
# `Envelope`/`Anchor`, the terminal set, and the byte-exact wire serializer
# (`build_record_line`) live in this LEAF crate so `qrmux` can emit the same vocab
# without a `qrmux → dispatch` cycle. `dispatch::events` re-exports every moved
# name so all existing call sites are byte-for-byte unaffected. DEFAULT features
# (json-insertion-order → serde_json/preserve_order ON) keep dispatch's own
# emission byte-exact — the leaf crate's serializer depends on it.
quorum-delivery-events = { path = "../quorum-delivery-events" }
# The pure submit-discipline LEAF crate (submit-extract): the acceptance-keyed
# verify-then-CR + chunked two-write PTY delivery core + the content-verified-CR
# composer predicate. Extracted here so `qrmux` (attended-UX M1 fire engine) can
# drive the SAME discipline without a `qrmux → dispatch` cycle. `crate::submit` /
# `crate::sendpty` re-export every moved name so all existing call sites are
# byte-for-byte unaffected. std-only (no features) — plain path dependency.
quorum-submit-discipline = { path = "../quorum-submit-discipline" }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util"] }
anyhow = "1"
# ACP crate-backed driver (provider/acp/client.rs). The official ACP client crate, pinned
# =1.0.1 behind the provider seam (migration-spec §5; D4/F4: this crate ALONE, NOT the
# `-tokio` 0.11.1 variant which pins the old 0.x line). async-process + futures are direct
# access to crates ALREADY transitive via agent-client-protocol (no new resolution surface):
# async-process spawns the bridge child with futures-compatible async pipes for the crate's
# ByteStreams transport AND keeps env_remove(BRIDGE_ENV_STRIP) expressible (MF1); futures
# supplies executor::block_on (drive the connection future on a bg thread, no tokio) + the
# channel::mpsc sync<->async bridge.
agent-client-protocol = "=1.0.1"
async-process = "2"
futures = "0.3"
# tungstenite: the codex app-server ws client (codex-p2-spec sections 3.1, 6.3,
# sanctioned dep S-1). SYNC/blocking call-per-verb — matches the sync engine, NO
# tokio/async creep. default-features=false drops ALL TLS (native-tls/rustls);
# we enable ONLY `handshake` (the client ws upgrade — data-encoding/http/
# httparse/sha1, NO TLS deps): codex talks plaintext ws://127.0.0.1:<port> on
# localhost only, so no TLS feature is enabled (minimal dep tree — section 6.3).
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# rusqlite: READ-ONLY best-effort cache over the codex $CODEX_HOME/state_5.sqlite
# `threads` table (codex-p2-spec sections 6.3, 6.4, sanctioned dep S-1). NON-bundled
# (default-features=false drops the `bundled` feature) → links the macOS system
# libsqlite3 (verified present: /usr/lib/libsqlite3.dylib). EVERY error (open /
# schema drift / query / wrong types) degrades to the rollout-scan fallback — the
# index is a CACHE, never a contract (cut-ladder rung C2: drop to rollout-only).
rusqlite = { version = "0.32", default-features = false }

[dev-dependencies]
tempfile = "3"
# portable-pty: the fakerepl gate (tests/fakerepl_gate.rs) drives the M1 submit
# discipline against the fakerepl binary over a REAL PTY. DEV-ONLY — it must
# never appear in the normal build (verify: `cargo tree -p quorum-dispatch` shows it only
# under [dev-dependencies]).
portable-pty = "0.9"

[features]
default = ["json-insertion-order"]
# Gates `serde_json/preserve_order` (see the dependency comment above) rather
# than requesting it unconditionally, so a plain path-dependency consumer can
# opt out via `default-features = false` without affecting dispatch's own
# binaries, which keep this on by default.
json-insertion-order = ["serde_json/preserve_order"]

# Negative-control evidence: deliberately-wrong decider outputs that the parity
# tests MUST catch (gate item 6). Never enabled in normal builds.
mutation-evidence = []

# --- WS-R R3a-Step-0 fault-injection harness (gated, never in normal builds) ---
# `faultinj` gates BOTH the RED-gate tests in tests/faultinj.rs AND the
# faultinj_target victim bin, so the default `cargo build`/`cargo test` is byte-
# unaffected (the no-regression floor). Run the harness with:
#   cargo test -p quorum-dispatch --features faultinj --test faultinj -- --nocapture
faultinj = []

# --- DE-observed idempotency RED-TEAM (loop component 2, gated) ---
# `deobs` gates the deobs_observe_target victim bin AND the subprocess-driven
# death/recovery probes in tests/deobs_redteam.rs (the in-process probes in that
# file are ALWAYS-ON). The default build stays byte-unaffected. Run the full
# battery with:
#   cargo test -p quorum-dispatch --features deobs --test deobs_redteam -- --nocapture --test-threads=1
deobs = []

# The controllable VICTIM process the fault-injection harness spawns. Gated on
# `faultinj` via required-features so it NEVER appears in the release `qd`
# binary or the default build (R3a-Step-0: not shipped). The harness finds it via
# CARGO_BIN_EXE_faultinj_target (Cargo sets that only when the bin is built).
[[bin]]
name = "faultinj_target"
path = "src/bin/faultinj_target.rs"
required-features = ["faultinj"]

# The standing R3c-Step-2 recovery coordinator (§5.1). A SEPARATE bin from `qd`
# (distinct compilation unit) so the `qd` binary stays byte-intact; it is a thin
# process shell around `dispatch::recovery::coordinator_pass`. Installed alongside
# `~/.quorum/bin/qd` and run under systemd --user (Restart=always + watchdog).
[[bin]]
name = "recovery_coordinator"
path = "src/bin/recovery_coordinator.rs"

# C-4 (a) — the fail-closed conformance grid minting invoker. A thin process
# shell around `dispatch::conformance::{read_run_dir, mint_grid}`: reads a run
# dir of deposited RunArtifacts and mints the certify-or-INVALID grid. C-5 wields
# it over a measured run dir; nothing certifiable escapes it.
[[bin]]
name = "mint-conformance-grid"
path = "src/bin/mint_conformance_grid.rs"

# The controllable VICTIM process the DE-observed red-team spawns. Gated on
# `deobs` via required-features so it NEVER ships in the release `qd` binary.
# The harness finds it via CARGO_BIN_EXE_deobs_observe_target.
[[bin]]
name = "deobs_observe_target"
path = "src/bin/deobs_observe_target.rs"
required-features = ["deobs"]

# NOTE: tests/faultinj.rs is auto-discovered by Cargo (no explicit [[test]]
# needed). Its RED-gate `#[test]`s are `#[cfg(feature = "faultinj")]`, so without
# the feature this test binary compiles to just the always-on detector tests.
