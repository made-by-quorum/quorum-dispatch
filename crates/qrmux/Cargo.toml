[package]
name = "qrmux"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "qrmux mux crate (Rust rewrite). Content-free scaffold; mux logic lands in later phases."

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
vte = "0.13"
portable-pty = "0.8"
nix = { version = "0.29", features = ["term", "signal", "user", "fs"] }
anyhow = "1"
thiserror = "2"
serde_json = "1"
sha2 = "0.10"
# The shared delivery-event VOCABULARY (vocab-extract). qrmux does NOT consume it
# YET — the M1 mux terminal emitter + M3 send-path events (attended-UX) will EMIT
# this vocab. Added now so it is importable without a `qrmux → dispatch` cycle
# (dispatch depends on qrmux; the vocab lives in a shared LEAF crate that depends
# on neither). DEFAULT features (json-insertion-order → serde_json/preserve_order)
# so M1/M3 emission is byte-identical to dispatch's.
quorum-delivery-events = { path = "../quorum-delivery-events" }
# The shared SUBMIT DISCIPLINE (submit-extract). qrmux implements the discipline's
# `Deps` traits against its LOCAL surface (pty_writer / screen model / child status)
# and drives `deliver_idle_two_write` at the fire seam — one compile-time definition
# of the discipline, no second parallel impl, no `qrmux → dispatch` cycle (the leaf
# depends on neither). DEFAULT features.
quorum-submit-discipline = { path = "../quorum-submit-discipline" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
terminal_size = "0.4"
unicode-width = "0.2"
dirs = "5"

# Agent-pid identity token (W2 / SPEC-v2 §5.A): darwin start-time via the SAME
# libproc proc_pidinfo(PROC_PIDTBSDINFO) call the consumer's §5.A fallback names →
# bit-identical values by construction. Exact-pinned (R8: a compile error is the
# API-drift backstop). macOS-only; `nix::libc` already covers sysctlbyname.
[target.'cfg(target_os = "macos")'.dependencies]
libproc = "=0.14.11"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
regex = "1"
portable-pty = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Compression-immune memory sampling for the G5/leak-guard rows (flake pass):
# proc_pid_rusage phys_footprint on macOS (bare `ps rss` undercounts retained
# pages once the compressor takes them — the 3865fe9 ratchet flake).
libc = "0.2"
