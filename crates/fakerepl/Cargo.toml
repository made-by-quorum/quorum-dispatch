[package]
name = "fakerepl"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "deterministic fake claude REPL for the A4 submit-discipline gate — test harness, never shipped"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[[bin]]
name = "fakerepl"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
