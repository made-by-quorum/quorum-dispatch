# extensions.toml — the SINGLE pin that this `sb` version blesses.
#
# WHAT THIS IS
#   One version pin in `sb` determines the matched `sbx` + plugins. This file is
#   baked into the `sb` binary at build time via `include_str!` (see
#   crates/sb/src/extensions.rs) and read by `sb bootstrap`'s extension cascade
#   to install the EXACT pinned `sbx` binary and the pinned work-model plugin.
#
#   Installing `sb` vX on two clean machines yields the SAME `sbx` + plugins.
#   The pin is AUTHORITATIVE, not advisory.
#
# HOW TO BUMP A PIN
#   1. Update the `rev` (and version/marketplace/plugin if they genuinely change)
#      below.
#   2. Run `scripts/validate-pins.sh` — it clones/fetches each pinned ref and
#      confirms it exists and builds. This is a MANUAL pre-tag gate; nothing in
#      the binary proves a remote ref exists or builds (the binary only bakes
#      this string — see the honesty note in extensions.rs).
#   3. Commit, then tag the `sb` release.
#
# SCHEMA (flat, one section per extension; values are double-quoted strings)
#   [sbx]
#     repo = "<git remote URL>"        # cloned/installed from here
#     rev  = "<full 40-char git sha>"  # the exact pinned commit on the repo's main
#   [plugins]
#     repo        = "<git remote URL>"
#     rev         = "<full 40-char git sha>"
#     marketplace = "<marketplace name>"  # KEEP STABLE — cache path depends on it
#     plugin      = "<plugin name>"       # KEEP STABLE — cache path depends on it
#     version     = "<plugin version>"    # KEEP STABLE — cache path depends on it
#
#   The plugins triple (marketplace="sbx", plugin="core", version="0.1.0") is the
#   commission cache path: ~/.claude/plugins/cache/<marketplace>/<plugin>/<version>/.
#   Live commissions resolve roles from that path, so DO NOT churn these three.

[sbx]
# ssh:// form (NOT scp-style git@github.com:…) — cargo install --git rejects scp-style.
repo = "ssh://git@github.com/private-org/sbx.git"
rev = "ab699f0d1fe9f49fcb8e8d60a7ae75eaf238a7f7"

[plugins]
repo = "ssh://git@github.com/private-org/plugins.git"
rev = "a4ff7e3be7e9a41e43536dcdb1d0a2bc80209a69"
marketplace = "sbx"
plugin = "core"
version = "0.1.0"
